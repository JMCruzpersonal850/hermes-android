name: Bot Mode Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/bot-mode

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test and build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub --fatal-infos

      - name: Run tests
        run: flutter test --no-pub

      - name: Restore persistent development signing key
        env:
          HERMES_DEBUG_KEYSTORE: ${{ secrets.HERMES_DEBUG_KEYSTORE }}
        run: |
          test -n "$HERMES_DEBUG_KEYSTORE"
          mkdir -p ~/.android
          printf '%s' "$HERMES_DEBUG_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore

      - name: Build arm64 Android APK
        run: flutter build apk --debug --split-per-abi

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-bot-mode-arm64-debug
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 14
